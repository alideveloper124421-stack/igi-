name: Build IGI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Install Android workload
      run: dotnet workload install android
    
    - name: Restore dependencies
      run: dotnet restore apps/ProjectIGI.Android/ProjectIGI.Android.csproj
    
    - name: Build APK
      run: dotnet publish apps/ProjectIGI.Android/ProjectIGI.Android.csproj -c Release -r android-arm64 --no-self-contained
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IGI-Headshot-APK
        path: apps/ProjectIGI.Android/bin/Release/net10.0/android-arm64/publish/*.dll
        if-no-files-found: error
    
    - name: Create APK package
      run: |
        cd apps/ProjectIGI.Android/bin/Release/net10.0/android-arm64/publish
        zip -r /tmp/IGI-Modified.zip .
    
    - name: Upload final package
      uses: actions/upload-artifact@v4
      with:
        name: IGI-Modified-Package
        path: /tmp/IGI-Modified.zip
